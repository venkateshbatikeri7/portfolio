      rel="stylesheet"

    <style>
      html {
        background: #0a0a0a;
      }
      /* Applied before paint so a light-mode reload never flashes dark. */
      html[data-theme='light'] {
        background: #e9e9e0;
      }
      #root {
        min-height: 100dvh;
      }
      .boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #0a0a0a;
        color: #dfff00;
        font-family: ui-monospace, monospace;
        font-size: 12px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
      }
      html[data-theme='light'] .boot {
        background: #e9e9e0;
        color: #6e8200;
      }
    </style>

    <script>
      // Runs before the bundle. Dark is the default; only an explicit stored
      // choice opts into light, so a first-time visitor never sees a flash.
      (function () {
        try {
          if (localStorage.getItem('portfolio-theme') === 'light') {
            document.documentElement.dataset.theme = 'light'
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute('content', '#e9e9e0')
          }
        } catch (e) {
          /* storage blocked — dark default stands */
        }
      })()
    </script>
